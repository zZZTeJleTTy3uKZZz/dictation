<!-- Плашка встречи: записывать этот разговор или нет. -->
<meta charset="utf-8">
<title>Записать встречу?</title>
<style>
  :root {
    color-scheme: light dark;
    --ground: #ffffff; --ink: #16161a; --faint: #6e6e78;
    --line: #e6e6ec; --accent: #2f6df6; --danger: #d7263d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #1f1f25; --ink: #f2f2f5; --faint: #9a9aa6;
      --line: #2e2e36; --accent: #5b8bff; --danger: #ff6b7f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px 18px;
    background: var(--ground); color: var(--ink);
    font: 14px/1.4 "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  .кто { font-size: 12px; color: var(--faint); letter-spacing: .03em; }
  h1 {
    margin: 4px 0 2px; font-size: 17px; font-weight: 640;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .сайт { font-size: 12.5px; color: var(--faint); min-height: 18px; }
  .кнопки { display: flex; gap: 8px; margin-top: 14px; }
  button {
    font: inherit; flex: 1; padding: 9px 6px; cursor: pointer;
    border-radius: 8px; border: 1px solid var(--line);
    background: transparent; color: var(--ink); white-space: nowrap;
  }
  button.да { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 560; }
  button:hover { border-color: var(--accent); }
  button.да:hover { filter: brightness(1.08); }
  button.нет:hover { border-color: var(--danger); color: var(--danger); }
  .мелкие { display: flex; gap: 14px; margin-top: 12px; font-size: 12.5px; }
  .мелкие a { color: var(--faint); cursor: pointer; text-decoration: none; }
  .мелкие a:hover { color: var(--accent); text-decoration: underline; }
  .срок { margin-left: auto; color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
</style>

<div class="кто" id="программа"></div>
<h1 id="название"></h1>
<div class="сайт" id="сайт"></div>

<div class="кнопки">
  <button class="да" id="записать">Записать</button>
  <button class="нет" id="не-надо">Не надо</button>
</div>

<div class="мелкие">
  <a id="всегда">всегда записывать</a>
  <a id="никогда">больше не спрашивать</a>
  <a id="молчи">тихий час</a>
  <span class="срок" id="срок"></span>
</div>

<script>
  // Плашка отдаёт один ответ и закрывается: решение принимает Go.
  async function показать() {
    const дано = await load();
    document.getElementById("программа").textContent = дано.program;
    document.getElementById("название").textContent = дано.title;
    document.getElementById("название").title = дано.title;
    document.getElementById("сайт").textContent = дано.host;
    // «Всегда» для сайта точнее, чем для всего браузера: разрешив Chrome,
    // человек разрешил бы заодно музыку и видео.
    if (дано.host) document.getElementById("всегда").textContent = "всегда записывать " + дано.host;
  }

  // Каждый ответ назван прямо здесь, без обёрток: ответы читает ловец, и
  // искать их должно быть видно глазом — и в странице, и проверкой.
  function при(id, нажали) { document.getElementById(id).addEventListener("click", нажали); }
  при("записать", () => answer("record"));
  при("не-надо", () => answer(""));
  при("всегда", () => answer("always"));
  при("никогда", () => answer("never"));
  при("молчи", () => answer("quiet"));
  document.addEventListener("keydown", (event) => {
    if (event.key === "Enter") answer("record");
    if (event.key === "Escape") answer("");
  });

  // Счётчик: плашка закрывается сама, чтобы не висеть над встречей.
  let осталось = 60;
  setInterval(() => {
    осталось -= 1;
    document.getElementById("срок").textContent = осталось > 0 ? осталось + " с" : "";
  }, 1000);

  показать();
</script>
