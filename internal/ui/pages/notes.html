<!-- История заметок голосом. -->
<meta charset="utf-8">
<title>Мои заметки</title>
<style>
  :root {
    color-scheme: light dark;
    --ground: #f6f6f9; --card: #ffffff; --ink: #16161a; --faint: #6e6e78;
    --line: #e6e6ec; --accent: #2f6df6; --danger: #d7263d;
    --shadow: 0 1px 2px rgba(16,16,26,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #131317; --card: #1e1e24; --ink: #f2f2f5; --faint: #9a9aa6;
      --line: #2e2e36; --accent: #5b8bff; --danger: #ff6b7f; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto; padding: 22px 22px 32px; max-width: 720px;
    background: var(--ground); color: var(--ink);
    font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
  }
  h1 { margin: 0 0 4px; font-size: 19px; font-weight: 650; }
  .подзаголовок { color: var(--faint); font-size: 13px; margin-bottom: 16px; }

  .поиск {
    width: 100%; font: inherit; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 13px;
    margin-bottom: 16px;
  }
  .поиск::placeholder { color: var(--faint); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .заметка {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px; box-shadow: var(--shadow);
  }
  .шапка {
    display: flex; align-items: baseline; gap: 10px;
    color: var(--faint); font-size: 12.5px; margin-bottom: 6px;
  }
  .когда { color: var(--ink); font-weight: 550; font-size: 13px; }
  /* Устройство — половина ответа на «что это было»: его видно сразу. */
  .откуда {
    margin-left: auto; padding: 1px 8px; border: 1px solid var(--line);
    border-radius: 999px; white-space: nowrap;
  }
  .текст { white-space: pre-wrap; overflow-wrap: anywhere; }
  .беда { color: var(--danger); font-size: 13px; }
  .ждём { color: var(--faint); font-style: italic; }

  .кнопки { display: flex; gap: 8px; margin-top: 10px; }
  button {
    font: inherit; color: var(--faint); background: transparent;
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 11px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.убрать:hover { border-color: var(--danger); color: var(--danger); }
  .пусто { color: var(--faint); text-align: center; padding: 48px 20px; }
  .сказать {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    background: var(--danger); color: #fff; padding: 9px 14px; border-radius: 9px;
  }
</style>

<h1>Мои заметки</h1>
<div class="подзаголовок" id="сколько"></div>
<input class="поиск" id="поиск" placeholder="Искать по словам — «созвон», «идея», «купить»" autofocus>
<div id="стол"></div>

<script>
  const экран = document.getElementById("стол");
  const поле = document.getElementById("поиск");
  const сколько = document.getElementById("сколько");

  function текст(value) {
    const место = document.createElement("div");
    место.textContent = value === undefined || value === null ? "" : value;
    return место.innerHTML;
  }

  function сказать(что) {
    const прежняя = document.querySelector(".сказать");
    if (прежняя) прежняя.remove();
    const место = document.createElement("div");
    место.className = "сказать";
    место.textContent = что;
    document.body.append(место);
    setTimeout(() => место.remove(), 6000);
  }

  function слово(число, одна, две, много) {
    const сотня = число % 100;
    if (сотня > 10 && сотня < 20) return много;
    switch (число % 10) {
      case 1: return одна;
      case 2: case 3: case 4: return две;
      default: return много;
    }
  }

  function нарисовать(ответ) {
    const все = ответ.items || [];
    экран.textContent = "";

    if (ответ.trouble) {
      сколько.textContent = "история не прочиталась: " + ответ.trouble;
      return;
    }
    сколько.textContent = все.length === 0 ? "" :
      все.length + " " + слово(все.length, "заметка", "заметки", "заметок");

    if (все.length === 0) {
      const пусто = document.createElement("div");
      пусто.className = "пусто";
      пусто.textContent = поле.value
        ? "По этим словам ничего не нашлось"
        : "Заметок пока нет. Нажмите сочетание клавиш и наговорите мысль — она появится здесь.";
      экран.append(пусто);
      return;
    }

    for (const note of все) {
      const место = document.createElement("div");
      место.className = "заметка";

      const тело = note.text
        ? '<div class="текст">' + текст(note.text) + "</div>"
        : (note.trouble
            ? '<div class="беда">без расшифровки: ' + текст(note.trouble) + "</div>"
            : '<div class="ждём">расшифровывается…</div>');

      место.innerHTML =
        '<div class="шапка">' +
          '<span class="когда">' + текст(note.at) + "</span>" +
          "<span>" + текст(note.when) + "</span>" +
          "<span>· " + текст(note.length) + "</span>" +
          (note.speech ? "<span>· " + текст(note.speech) + "</span>" : "") +
          '<span class="откуда">' + текст(note.device) + "</span>" +
        "</div>" + тело;

      const кнопки = document.createElement("div");
      кнопки.className = "кнопки";
      if (note.has_audio) {
        const послушать = document.createElement("button");
        послушать.textContent = "послушать";
        послушать.addEventListener("click", async () => {
          try { await play(note.id); } catch (беда) { сказать(String(беда)); }
        });
        кнопки.append(послушать);
      }
      if (note.text) {
        const копия = document.createElement("button");
        копия.textContent = "скопировать";
        копия.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(note.text);
            копия.textContent = "скопировано";
            setTimeout(() => (копия.textContent = "скопировать"), 1500);
          } catch (беда) { сказать("скопировать не вышло"); }
        });
        кнопки.append(копия);
      }
      if (note.text !== undefined) {
        const править = document.createElement("button");
        править.textContent = "править";
        править.addEventListener("click", () => {
          // Правка меняет только текст: звук, время и источник остаются как
          // были — их пишет диктофон, и терять их из-за опечатки нельзя.
          const было = note.text || "";
          const место1 = document.createElement("textarea");
          место1.className = "правка";
          место1.value = было;
          место1.style.width = "100%";
          место1.style.font = "inherit";
          место1.style.color = "var(--ink)";
          место1.style.background = "var(--card)";
          место1.style.border = "1px solid var(--line)";
          место1.style.borderRadius = "8px";
          место1.style.padding = "8px 10px";
          место1.style.minHeight = "70px";

          const сохранить = document.createElement("button");
          сохранить.textContent = "сохранить";
          const отмена = document.createElement("button");
          отмена.textContent = "отмена";
          const ряд = document.createElement("div");
          ряд.className = "кнопки";
          ряд.append(сохранить, отмена);

          const старый = место.querySelector(".текст, .ждём, .беда");
          if (старый) { старый.replaceWith(место1); } else { место.append(место1); }
          кнопки.replaceWith(ряд);
          место1.focus();

          отмена.addEventListener("click", обновить);
          сохранить.addEventListener("click", async () => {
            try {
              // Значение — «номер=текст»: ядро режет его по первому знаку
              // равенства, поэтому текст заметки может содержать любые.
              await setNoteText(note.id + "=" + место1.value);
              обновить();
            } catch (беда) { сказать(String(беда)); }
          });
        });
        кнопки.append(править);
      }
      const убрать = document.createElement("button");
      убрать.className = "убрать";
      убрать.textContent = "удалить";
      убрать.addEventListener("click", async () => {
        // Спрашиваем: удаление уносит и звук, а восстановить его неоткуда.
        if (!confirm("Удалить заметку вместе со звуком?")) return;
        try {
          await forget(note.id);
          обновить();
        } catch (беда) { сказать(String(беда)); }
      });
      кнопки.append(убрать);
      место.append(кнопки);

      экран.append(место);
    }
  }

  async function обновить() {
    try {
      нарисовать(await load(поле.value || ""));
    } catch (беда) {
      сказать(String(беда && беда.message ? беда.message : беда));
    }
  }

  // Ищем не на каждую букву: история читается с диска, и дёргать её двадцать раз
  // на слово незачем.
  let ждём = null;
  поле.addEventListener("input", () => {
    clearTimeout(ждём);
    ждём = setTimeout(обновить, 200);
  });

  обновить();
  // Обновляем сами: расшифровка приезжает через несколько секунд после заметки,
  // и человек не должен нажимать «обновить», чтобы её увидеть.
  setInterval(обновить, 5000);
  document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeWindow(); });
</script>
